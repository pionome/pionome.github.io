<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pio - Mods</title>
    <link rel="icon" type="image/png" href="/assets/favicon-96x96.png" sizes="96x96" />
	<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
	<link rel="shortcut icon" href="/assets/favicon.ico" />
	<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
	<meta name="apple-mobile-web-app-title" content="Pio" />
	<link rel="manifest" href="/assets/site.webmanifest" />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <style>
        :root {
            --bg-color: #f4f8ff;      
            --grid-line: #dce7f7;     
            --panel-bg: #ffffff;
            --text-main: #5a6585;     
            --accent-primary: #94b0ff;
            --accent-secondary: #e0cdff;
            --accent-tag: #eef2ff;
            --border-width: 2px;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                linear-gradient(var(--grid-line) 2px, transparent 2px),
                linear-gradient(90deg, var(--grid-line) 2px, transparent 2px);
            background-size: 60px 60px;
            display: flex; flex-direction: column; align-items: center;
        }

        .panel {
            background: var(--panel-bg);
            border: var(--border-width) solid var(--accent-primary);
            border-radius: 0.75rem;
        }

        .navbar-toggle {
            position: fixed; font-size: 1.5rem; top: 15px; right: 15px;
            width: 45px; height: 45px; display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1001; background: white;
        }
        .navbar-toggle:hover { transform: translate(-3px, -3px); box-shadow: 4px 4px 0px var(--accent-primary); }

        .nav-panel {
            transform-origin: right;
            position: fixed; top: 15px; right: 100px;
            scale: 0 100%; opacity: 0; visibility: hidden;
            display: flex; flex-direction: column; gap: 0.4rem;
            padding: 20px; z-index: 1000;
        }
		
		.nav-main-row { display: flex; gap: 0.8rem; }
        .nav-btn-large {
            flex: 1; text-align: center; color: var(--text-main);
            text-decoration: none; font-size: 1.2rem; font-weight: 1000;
            padding: 5px; transition: all 0.2s ease;
        }
        .nav-btn-large:hover { transform: translate(0px, -3px); box-shadow: 0px 4px 0px var(--accent-primary); color: var(--accent-primary); }

        .dashed-line { border: none; border-top: 2px dashed var(--grid-line); margin: 5px 0; }

        .nav-sub-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .nav-tag-small {
            text-decoration: none; color: var(--text-main); background: #fff;
            font-size: 0.9rem; font-weight: 700; padding: 6px 14px; transition: all 0.2s ease;
        }
        .nav-tag-small:hover { box-shadow: 0px 4px 0px var(--accent-primary); color: var(--accent-primary); }
        .nav-panel.active { animation: bounceIn 0.5s cubic-bezier(0.34, 1.16, 0.94, 1) forwards; }
        
        @keyframes bounceIn {
            0% { scale: 0 100%; opacity: 0; visibility: hidden; }
            60% { scale: 105% 100%; opacity: 1; visibility: visible; }
            100% { scale: 100% 100%; opacity: 1; visibility: visible; }
        }

        .content-container { width: 98%; max-width: 1500px; margin: 100px 0 50px; }
        .section-title { font-size: 1.8rem; font-weight: 900; margin: 0 0 40px; text-align: center; }

        .mods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 315px); 
            gap: 25px;
            justify-content: center;
        }

        .mod-card {
            background: white; border: var(--border-width) solid var(--accent-primary);
            border-radius: 1rem; overflow: hidden; cursor: pointer;
            transition: all 0.2s ease; display: flex; flex-direction: column;
            width: 315px;
        }
        .mod-card:hover { transform: translate(-5px, -5px); box-shadow: 7px 7px 0px var(--accent-primary); }

        .mod-image { 
            width: 100%; height: 180px; object-fit: cover; 
            border-bottom: var(--border-width) solid var(--accent-primary);
        }

        .mod-content { padding: 18px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
        .mod-title { margin: 0; font-size: 1.1rem; font-weight: 800; line-height: 1.2; }
        
        .mod-game { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 700; opacity: 0.8; }
        .game-icon { width: 20px; height: 20px; border-radius: 4px; }

        .mod-stats { 
            display: flex; gap: 12px; margin-top: auto; padding-top: 10px;
            border-top: 1px dashed var(--grid-line); font-size: 0.8rem; font-weight: 800;
        }
        .mod-stat { display: flex; align-items: center; gap: 5px; }

        #loading, #error { text-align: center; font-weight: 900; margin-top: 50px; }
        .controls { display: none; justify-content: center; margin-top: 40px; }

        @media (max-width: 1200px) { .nav-panel { top: 75px; left: 0; right: 0; margin: 10px; } }
    </style>
</head>
<body>

    <nav class="panel nav-panel" id="navbarPanel">
        <div class="nav-main-row">
            <a href="/" class="nav-btn-large"><i class="fa-solid fa-house"></i> Home</a>
            <a href="/art" class="nav-btn-large"><i class="fa-solid fa-paint-brush"></i> Art</a>
            <a href="games" class="nav-btn-large"><i class="fa-solid fa-gamepad"></i> Games</a>
        </div>
        <hr class="dashed-line">
        <div class="nav-sub-row">
            <a href="/web-apps" class="nav-tag-small">Web Apps</a>
            <a href="/programs" class="nav-tag-small">Programs</a>
			<a href="/misc-programs" class="nav-tag-small">Misc Programs</a>
            <a href="/repositories" class="nav-tag-small">Repos</a>
            <a href="/mods" class="nav-tag-small" style="color:var(--accent-primary)">Mods</a>
        </div>
    </nav>
    <div class="panel navbar-toggle" id="navbarToggle"><i class="fa-solid fa-bars"></i></div>

    <div class="content-container">
        <h2 class="section-title">Game Mods</h2>
        <div id="loading">Fetching from GameBanana...</div>
        <div id="error" style="display:none;"></div>
        <div id="mods-container" class="mods-grid"></div>
        <div id="controls" class="controls">
            <button id="load-more" class="panel nav-tag-small" style="padding: 10px 30px; cursor:pointer;">Load More</button>
        </div>
    </div>

<script>
const memberId = '1757842';
const perPage = 20;
let currentPage = 1;

async function fetchMods() {
    const loading = document.getElementById('loading');
    const container = document.getElementById('mods-container');
    const controls = document.getElementById('controls');
    loading.style.display = 'block';

    try {
        const response = await fetch(`https://gamebanana.com/apiv11/Member/${memberId}/SubFeed?_nPage=${currentPage}&_nPerpage=${perPage}`);
        const data = await response.json();

        if (!data || !data._aRecords || data._aRecords.length === 0) {
            loading.style.display = 'none';
            return;
        }

        loading.style.display = 'none';
        displayMods(data._aRecords);

        if (data._aMetadata._bIsComplete) {
            controls.style.display = 'none';
        } else {
            currentPage++;
            controls.style.display = 'flex';
        }
    } catch (e) {
        loading.style.display = 'none';
        const errorDiv = document.getElementById('error');
        errorDiv.textContent = `Error: ${e.message}`;
        errorDiv.style.display = 'block';
    }
}

function displayMods(modsToDisplay) {
    const container = document.getElementById('mods-container');
    modsToDisplay.forEach(mod => {
        const card = document.createElement('div');
        card.className = 'mod-card';
        
        const previewImage = mod._aPreviewMedia?._aImages?.[0] ? `${mod._aPreviewMedia._aImages[0]._sBaseUrl}/${mod._aPreviewMedia._aImages[0]._sFile}` : "";
        const gameIcon = mod._aGame?._sIconUrl || "";
        
        card.innerHTML = `
            <img src="${previewImage}" class="mod-image" alt="${mod._sName}" loading="lazy">
            <div class="mod-content">
                <h3 class="mod-title">${mod._sName}</h3>
                <div class="mod-game">
                    <img src="${gameIcon}" class="game-icon">
                    <span>${mod._aGame?._sName || 'Unknown Game'}</span>
                </div>
                <div class="mod-stats">
                    <span class="mod-stat"><i class="fas fa-eye"></i> ${mod._nViewCount || 0}</span>
                    <span class="mod-stat"><i class="fas fa-comment"></i> ${mod._nPostCount || 0}</span>
                    <span class="mod-stat"><i class="fas fa-thumbs-up"></i> ${mod._nLikeCount || 0}</span>
                </div>
            </div>
        `;
        
        card.onclick = () => window.open(mod._sProfileUrl, '_blank');
        container.appendChild(card);
    });
}

document.getElementById('load-more').onclick = fetchMods;
fetchMods();
</script>
<script src="/scripts/shared.js"></script>
</body>
</html>
