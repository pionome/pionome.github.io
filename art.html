<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pio - Art</title>
    <link rel="icon" type="image/png" href="/assets/favicon-96x96.png" sizes="96x96" />
	<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
	<link rel="shortcut icon" href="/assets/favicon.ico" />
	<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
	<meta name="apple-mobile-web-app-title" content="Pio" />
	<link rel="manifest" href="/assets/site.webmanifest" />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <style>
        :root {
            --bg-color: #f4f8ff;      
            --grid-line: #dce7f7;     
            --panel-bg: #ffffff;
            --text-main: #5a6585;     
            --accent-primary: #94b0ff;
            --accent-secondary: #e0cdff;
            --accent-tag: #eef2ff;
            --border-width: 2px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                linear-gradient(var(--grid-line) 2px, transparent 2px),
                linear-gradient(90deg, var(--grid-line) 2px, transparent 2px);
            background-size: 60px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .panel {
            background: var(--panel-bg);
            border: var(--border-width) solid var(--accent-primary);
            border-radius: 0.75rem;
        }

        .navbar-toggle {
            position: fixed;
            font-size: 1.5rem;
            top: 15px;
            right: 15px;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1001;
            background: white;
        }
        .navbar-toggle:hover {
            transform: translate(-3px, -3px);
            box-shadow: 4px 4px 0px var(--accent-primary);
        }

        .nav-panel {
            transform-origin: right;
            position: fixed;
            top: 15px;
            right: 100px;
            scale: 0 100%;
            opacity: 0;
            visibility: hidden;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            padding: 20px;
            z-index: 1000;
        }
		
		.nav-main-row {
            display: flex;
            gap: 0.8rem;
        }

        .nav-btn-large {
            flex: 1;
            text-align: center;
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 1000;
            padding: 5px;
            transition: all 0.2s ease;
        }

        .nav-btn-large:hover {
            transform: translate(0px, -3px);
            box-shadow: 0px 4px 0px var(--accent-primary);
			color: var(--accent-primary);
        }

        .dashed-line {
            border: none;
            border-top: 2px dashed var(--grid-line);
            margin: 5px 0;
        }

        .nav-sub-row {
            display: flex;
            flex-wrap: wrap; 
            gap: 10px;
            justify-content: center;
        }

        .nav-tag-small {
            text-decoration: none;
            color: var(--text-main);
            background: #fff;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 6px 14px;
            transition: all 0.2s ease;
        }

        .nav-tag-small:hover {
            box-shadow: 0px 4px 0px var(--accent-primary);
			color: var(--accent-primary);
        }
		
        .nav-panel.active { animation: bounceIn 0.5s cubic-bezier(0.34, 1.16, 0.94, 1) forwards; }
        @keyframes bounceIn {
            0% { scale: 0 100%; opacity: 0; visibility: hidden; }
            60% { scale: 105% 100%; opacity: 1; visibility: visible; }
            100% { scale: 100% 100%; opacity: 1; visibility: visible; }
        }

        .gallery-container { width: 90%; max-width: 1200px; margin: 100px 0 50px; }
        #art-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; }

        .art-card {
            background: white;
            border: var(--border-width) solid var(--accent-primary);
            border-radius: 1rem;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
        }
        .art-card:hover {
            transform: translate(-6px, -6px);
            box-shadow: 8px 8px 0px var(--accent-primary);
        }

        .art-thumbnail-container { width: 100%; aspect-ratio: 1/1; overflow: hidden; border-bottom: var(--border-width) solid var(--accent-primary); background: #fdfdfd; }
        .art-thumbnail { width: 100%; height: 100%; object-fit: cover; }
        .art-content { padding: 15px; }
        .art-title { margin: 0; font-size: 1.1rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(90, 101, 133, 0.4);
            backdrop-filter: blur(8px);
        }
        .modal-content {
            background: white;
            margin: 5vh auto;
            width: 90%;
            max-width: 1100px;
            height: 85vh;
            border: 3px solid var(--accent-primary);
            border-radius: 1.5rem;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            background: white;
            border: 2px solid var(--accent-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 100;
            transition: all 0.2s;
        }
        .close-modal:hover {
            transform: translate(-3px, -3px);
            box-shadow: 4px 4px 0px var(--accent-primary);
		}

        .modal-image-pane {
            flex: 1.5;
            background: #f8faff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-right: 2px dashed var(--grid-line);
        }

        .spinner {
            width: 40px; height: 40px;
            border: 4px solid var(--accent-tag);
            border-top: 4px solid var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: absolute;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .modal-info-pane { flex: 1; padding: 40px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }

		.modal-art-link {
			text-align:center;
			padding:10px;
			background:white;
			border:2px solid var(--accent-primary);
			border-radius:10px;
			text-decoration:none;
			color:var(--accent-primary);
			font-weight:800;
			transition:0.2s;
		}
		.modal-art-link:hover {
            transform: translate(-3px, -3px);
            box-shadow: 4px 4px 0px var(--accent-primary);
		}
        .pager-ui {
            position: absolute;
            bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: white;
            padding: 8px 20px;
            border-radius: 50px;
            border: 2px solid var(--accent-primary);
            box-shadow: 0 4px 0 var(--grid-line);
			color: var(--accent-primary);
        }
		
		.pager-ui button {
			color: var(--accent-primary);
		}
		.pager-ui button:hover {
			color: var(--text-main);
		}

        #load-more {
            padding: 12px 45px;
            font-family: inherit;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            margin: 40px auto;
            display: block;
        }

        .tag-modal {
            display: inline-block;
            background: var(--accent-tag);
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            margin: 3px;
            border: 1px solid var(--grid-line);
        }
		
		.section-title { font-size: 1.8rem; font-weight: 900; margin: 0 0 40px; text-align: center; }
		
		@media (max-width: 995px) {
			.modal-content {
				background: white;
				margin: auto;
				width: 95%;
				max-width: 1100px;
				height: 95%;
				border: 3px solid var(--accent-primary);
				border-radius: 1.5rem;
				display: flex;
				overflow: hidden;
				position: relative;
				flex-direction: column;
				margin-top: 2%;
			}
			.modal-info-pane {
			  flex: 1;
			  padding: 40px;
			  display: flex;
			  flex-direction: column;
			  gap: 5px;
			  overflow-y: auto;
			}
			.modal-image-pane {
				max-height: 70%;
				border-right: unset;
				border-bottom: 2px dashed var(--grid-line);
			}
			.modal-info-pane > div:nth-child(6) {
			  justify-content: center;
			}
			.nav-panel {
				top: 75px;
				left: 0;
				right: 0;
				margin: 10px;
			}
		}
		
		@media (max-width: 500px) {
			#art-container {
				grid-template-columns: unset;
			}
		}
    </style>
</head>
<body>

    <nav class="panel nav-panel" id="navbarPanel">
        <div class="nav-main-row">
            <a href="/" class="nav-btn-large"><i class="fa-solid fa-house"></i> Home</a>
            <a href="/art" class="nav-btn-large" style="color:var(--accent-primary)"><i class="fa-solid fa-paint-brush"></i> Art</a>
            <a href="/games" class="nav-btn-large"><i class="fa-solid fa-gamepad"></i> Games</a>
        </div>
        <hr class="dashed-line">
        <div class="nav-sub-row">
			<a href="/web-apps" class="nav-tag-small">Web Apps</a>
			<a href="/programs" class="nav-tag-small">Programs</a>
			<a href="/misc-programs" class="nav-tag-small">Misc Programs</a>
			<a href="/repositories" class="nav-tag-small">Repos</a>
			<a href="/mods" class="nav-tag-small">Mods</a>
		</div>
    </nav>
    <div class="panel navbar-toggle" id="navbarToggle"><i class="fa-solid fa-bars"></i></div>

    <div class="gallery-container">
        <h2 class="section-title">Art</h2>
        <div id="art-container"></div>
        <div id="loading" style="text-align: center; font-size:1.5rem; font-weight: 900">Loading Art...</div>
        <div id="controls" style="display:none;"><button id="load-more" class="panel">Load More</button></div>
    </div>

    <div id="artModal" class="modal">
        <div class="modal-content" id="modalInner">
            <div class="close-modal"><i class="fa-solid fa-xmark"></i></div>
            
            <div class="modal-image-pane">
                <div id="modalLoading" class="spinner"></div>
                <img id="modalArtImage" style="max-width:95%; max-height:95%; object-fit:contain; border-radius: 5px;">
                
                <div class="pager-ui" id="pagerContainer" style="display:none;">
                    <button id="prevPageBtn" style="border:none; background:none; cursor:pointer; font-size:1.2rem;"><i class="fas fa-arrow-left"></i></button>
                    <span id="pageIndicator" style="font-weight:800; min-width:40px; text-align:center;">1/1</span>
                    <button id="nextPageBtn" style="border:none; background:none; cursor:pointer; font-size:1.2rem;"><i class="fas fa-arrow-right"></i></button>
                </div>
            </div>

            <div class="modal-info-pane">
                <h2 id="modalArtTitle" style="margin:0; font-size:1.5rem; line-height:1.2;"></h2>
                <div id="modalArtist" style="display:flex; align-items:center; gap:12px;">
                    <img id="modalArtistAvatar" style="width:32px; height:32px; border-radius:50%; border:2px solid var(--accent-primary);">
                    <span id="modalArtistName" style="font-weight:800; font-size:1.1rem;"></span>
                </div>
                <hr style="border:none; border-top:2px dashed var(--grid-line);">
                <div id="modalArtDescription" style="font-size:0.95rem; line-height:1.5; color: var(--text-main);"></div>
                <div id="modalArtTags"></div>
                
                <div style="margin-top:auto; background:var(--bg-color); padding:15px; border-radius:12px; display:flex; flex-wrap:wrap; gap:15px; font-size:0.85rem; font-weight:700;">
                    <span><i class="fas fa-heart" ></i> <span id="modalArtLikes"></span></span>
                    <span><i class="fas fa-eye" ></i> <span id="modalArtViews"></span></span>
                    <span><i class="fas fa-calendar"></i> <span id="modalArtDate"></span></span>
                </div>
                <a id="modalArtLink" class="modal-art-link" target="_blank" >View on Pixiv</a>
            </div>
        </div>
    </div>

<script src="/scripts/shared.js"></script>
<script>
    const modal = document.getElementById('artModal');
    const modalInner = document.getElementById('modalInner');
    
    modal.onclick = (e) => { if (e.target === modal) closeModal(); };
    document.querySelector('.close-modal').onclick = closeModal;

    function closeModal() {
        modal.style.display = 'none';
        document.body.style.overflow = 'auto';
        document.getElementById('modalArtImage').src = '';
    }

    const userId = '46385589';
    const proxy = 'https://pixivnow-eight.vercel.app';
    let allIllustIds = [], currentPage = 1, currentArtwork = null, currentPageIndex = 0, userProfile = null;

    function fixUrl(url) { return url.replace('https://i.pximg.net', `${proxy}/~`).replace('https://s.pximg.net', `${proxy}/~`); }
    function formatDate(d) { return new Date(d).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); }

    async function init() {
        const uRes = await fetch(`${proxy}/ajax/user/${userId}?full=1`);
        userProfile = await uRes.json();
        const pRes = await fetch(`${proxy}/ajax/user/${userId}/profile/all`);
        const pData = await pRes.json();
        allIllustIds = Object.keys(pData.illusts).reverse();
        loadBatch();
    }

    async function loadBatch() {
        document.getElementById('loading').style.display = 'block';
        const batch = allIllustIds.slice((currentPage - 1) * 15, currentPage * 15);
        const res = await fetch(`${proxy}/ajax/user/${userId}/illusts?${batch.map(id => `ids[]=${id}`).join('&')}`);
        const data = await res.json();
        render(Object.values(data));
        currentPage++;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('controls').style.display = 'block';
    }

    function render(arts) {
        arts.reverse().forEach(art => {
            const el = document.createElement('div');
            el.className = 'art-card';
            el.innerHTML = `
                <div class="art-thumbnail-container"><img src="${fixUrl(art.url)}" class="art-thumbnail"></div>
                <div class="art-content"><h3 class="art-title">${art.title}</h3></div>`;
            el.onclick = () => openArt(art.id);
            document.getElementById('art-container').appendChild(el);
        });
    }

    async function openArt(id) {
		document.getElementById('modalArtImage').style.opacity = '0';
		document.getElementById('modalLoading').style.display = 'block';
		document.getElementById('pagerContainer').style.display = 'none';
		
		document.getElementById('modalArtTitle').innerText = 'Loading...';
		document.getElementById('modalArtDescription').innerHTML = '';
		document.getElementById('modalArtTags').innerHTML = '';
		document.getElementById('modalArtLikes').innerText = '-';
		document.getElementById('modalArtViews').innerText = '-';
		document.getElementById('modalArtDate').innerText = '-';

		modal.style.display = 'block';
		document.body.style.overflow = 'hidden';

		const res = await fetch(`${proxy}/ajax/illust/${id}`);
		currentArtwork = await res.json();

		document.getElementById('modalArtTitle').innerText = currentArtwork.title;
		document.getElementById('modalArtistName').innerText = userProfile.name;
		document.getElementById('modalArtistAvatar').src = fixUrl(userProfile.imageBig);
		document.getElementById('modalArtDescription').innerHTML = currentArtwork.description || "";
		document.getElementById('modalArtLikes').innerText = currentArtwork.likeCount;
		document.getElementById('modalArtViews').innerText = currentArtwork.viewCount;
		document.getElementById('modalArtDate').innerText = formatDate(currentArtwork.createDate);
		document.getElementById('modalArtLink').href = `https://www.pixiv.net/artworks/${id}`;
		
		const tagBox = document.getElementById('modalArtTags');
		tagBox.innerHTML = ''; 
		currentArtwork.tags.tags.forEach(t => {
			const s = document.createElement('span'); 
			s.className = 'tag-modal'; 
			s.innerText = t.tag;
			tagBox.appendChild(s);
		});

		if (currentArtwork.pageCount > 1) {
			document.getElementById('pagerContainer').style.display = 'flex';
		}

		setPage(0);
	}

    function setPage(idx) {
        currentPageIndex = idx;
        document.getElementById('modalLoading').style.display = 'block';
        const img = document.getElementById('modalArtImage');
        img.style.opacity = '0';
        
        let url = currentArtwork.urls.regular;
        if (currentArtwork.pageCount > 1) url = url.replace('_p0', `_p${idx}`);
        
        img.src = fixUrl(url);
        img.onload = () => {
            img.style.opacity = '1';
            document.getElementById('modalLoading').style.display = 'none';
        };
        document.getElementById('pageIndicator').innerText = `${idx + 1}/${currentArtwork.pageCount}`;
    }

    document.getElementById('prevPageBtn').onclick = () => { if(currentPageIndex > 0) setPage(currentPageIndex - 1); };
    document.getElementById('nextPageBtn').onclick = () => { if(currentPageIndex < currentArtwork.pageCount - 1) setPage(currentPageIndex + 1); };
    document.getElementById('load-more').onclick = loadBatch;

    init();
</script>
</body>
</html>
