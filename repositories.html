<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pio - Repositories</title>
    <link rel="icon" type="image/png" href="/assets/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Pio" />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #f4f8ff;      
            --grid-line: #dce7f7;     
            --panel-bg: #ffffff;
            --text-main: #5a6585;     
            --accent-primary: #94b0ff;
            --accent-secondary: #e0cdff;
            --accent-tag: #eef2ff;
            --border-width: 2px;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                linear-gradient(var(--grid-line) 2px, transparent 2px),
                linear-gradient(90deg, var(--grid-line) 2px, transparent 2px);
            background-size: 60px 60px;
            display: flex; flex-direction: column; align-items: center;
        }

        .panel {
            background: var(--panel-bg);
            border: var(--border-width) solid var(--accent-primary);
            border-radius: 0.75rem;
        }

        .navbar-toggle {
            position: fixed; font-size: 1.5rem; top: 15px; right: 15px;
            width: 45px; height: 45px; display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1001; background: white;
        }
        .navbar-toggle:hover { transform: translate(-3px, -3px); box-shadow: 4px 4px 0px var(--accent-primary); }

        .nav-panel {
            transform-origin: right;
            position: fixed; top: 15px; right: 100px;
            scale: 0 100%; opacity: 0; visibility: hidden;
            display: flex; flex-direction: column; gap: 0.4rem;
            padding: 20px; z-index: 1000;
        }
		
        .nav-main-row { display: flex; gap: 0.8rem; }
        .nav-btn-large {
            flex: 1; text-align: center; color: var(--text-main);
            text-decoration: none; font-size: 1.2rem; font-weight: 800;
            padding: 5px; transition: all 0.2s ease;
        }
        .nav-btn-large:hover { transform: translate(0px, -3px); box-shadow: 0px 4px 0px var(--accent-primary); color: var(--accent-primary); }

        .dashed-line { border: none; border-top: 2px dashed var(--grid-line); margin: 5px 0; }

        .nav-sub-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .nav-tag-small {
            text-decoration: none; color: var(--text-main); background: #fff;
            font-size: 0.9rem; font-weight: 700; padding: 6px 14px; transition: all 0.2s ease;
        }
        .nav-tag-small:hover { box-shadow: 0px 4px 0px var(--accent-primary); color: var(--accent-primary); }
        .nav-panel.active { animation: bounceIn 0.5s cubic-bezier(0.34, 1.16, 0.94, 1) forwards; }
        
        @keyframes bounceIn {
            0% { scale: 0 100%; opacity: 0; visibility: hidden; }
            60% { scale: 105% 100%; opacity: 1; visibility: visible; }
            100% { scale: 100% 100%; opacity: 1; visibility: visible; }
        }

        .content-container { width: 98%; max-width: 1500px; margin: 100px 0 50px; }
        .section-title { font-size: 1.8rem; font-weight: 800; margin: 0 0 40px; text-align: center; }

        .repos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 340px); 
            gap: 25px;
            justify-content: center;
        }

        .repo-card {
            background: white; border: var(--border-width) solid var(--accent-primary);
            border-radius: 1rem; padding: 20px; cursor: pointer;
            transition: all 0.2s ease; display: flex; flex-direction: column; gap: 12px;
        }
        .repo-card:hover { transform: translate(-5px, -5px); box-shadow: 7px 7px 0px var(--accent-primary); }

        .repo-header { display: flex; align-items: center; gap: 12px; }
        .repo-avatar { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--grid-line); }
        .repo-name { margin: 0; font-size: 1.1rem; font-weight: 800; color: var(--text-main); }
        .repo-owner { margin: 0; font-size: 0.85rem; opacity: 0.7; }
        .repo-description { margin: 0; font-size: 0.9rem; line-height: 1.4; flex-grow: 1; }

        .repo-stats { display: flex; gap: 15px; font-size: 0.85rem; font-weight: 700; margin-top: 10px; }
        .repo-stat { display: flex; align-items: center; gap: 5px; }
        .repo-language-dot { width: 10px; height: 10px; border-radius: 50%; }

        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(244, 248, 255, 0.8);
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: white; margin: 10% auto; padding: 30px;
            width: 90%; max-width: 500px; position: relative;
        }
        .modal-header { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; }
        .modal-stats-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0;
        }
        .modal-stat-box {
            background: var(--accent-tag); padding: 10px; border-radius: 8px;
            text-align: center; border: 1px solid var(--grid-line);
        }
        .language-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
        .language-tag { 
            background: #fff; border: 1px solid var(--grid-line); 
            padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 700;
            display: flex; align-items: center; gap: 6px;
        }
        .modal-footer { margin-top: 25px; display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 10px; text-align: center; border-radius: 8px;
            text-decoration: none; font-weight: 800; transition: all 0.2s;
            border: var(--border-width) solid var(--accent-primary);
        }
        .btn-primary { background: var(--accent-primary); color: white; }
        .btn-secondary { background: white; color: var(--text-main); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 0 var(--accent-primary); }

        #loading, #error { text-align: center; font-weight: 800; margin-top: 50px; }
        .controls { display: none; justify-content: center; margin-top: 40px; }

        @media (max-width: 1200px) { .nav-panel { top: 75px; left: 0; right: 0; margin: 10px; transform-origin: top; } }
    </style>
</head>
<body>

    <nav class="panel nav-panel" id="navbarPanel">
        <div class="nav-main-row">
            <a href="/" class="nav-btn-large"><i class="fa-solid fa-house"></i> Home</a>
            <a href="/art" class="nav-btn-large"><i class="fa-solid fa-paint-brush"></i> Art</a>
            <a href="/games" class="nav-btn-large"><i class="fa-solid fa-gamepad"></i> Games</a>
        </div>
        <hr class="dashed-line">
        <div class="nav-sub-row">
            <a href="/web-apps" class="nav-tag-small">Web Apps</a>
            <a href="/programs" class="nav-tag-small">Programs</a>
            <a href="/misc-programs" class="nav-tag-small">Misc Programs</a>
            <a href="/repositories" class="nav-tag-small" style="color:var(--accent-primary)">Repos</a>
            <a href="/mods" class="nav-tag-small">Mods</a>
        </div>
    </nav>
    <div class="panel navbar-toggle" id="navbarToggle"><i class="fa-solid fa-bars"></i></div>

    <div class="content-container">
        <h2 class="section-title">GitHub Repositories</h2>
        <div id="loading">Fetching Repos...</div>
        <div id="error" style="display:none;"></div>
        <div id="repos-container" class="repos-grid"></div>
        <div id="controls" class="controls">
            <button id="load-more" class="panel btn-secondary" style="padding: 10px 30px; cursor:pointer;">Load More</button>
        </div>
    </div>

    <div id="repoModal" class="modal">
        <div class="panel modal-content">
            <div id="modalLoading" style="position:absolute; top:10px; right:10px; font-size:0.8rem;">Loading details...</div>
            <div class="modal-header">
                <img id="modalRepoAvatar" class="repo-avatar" src="">
                <div>
                    <h3 id="modalRepoName" class="repo-name" style="font-size:1.4rem;"></h3>
                    <p id="modalRepoOwner" class="repo-owner"></p>
                </div>
            </div>
            <p id="modalRepoDescription"></p>
            <div class="modal-stats-grid">
                <div class="modal-stat-box"><strong>Stars:</strong> <span id="modalRepoStars"></span></div>
                <div class="modal-stat-box"><strong>Forks:</strong> <span id="modalRepoForks"></span></div>
                <div class="modal-stat-box"><strong>Watchers:</strong> <span id="modalRepoWatchers"></span></div>
                <div class="modal-stat-box"><strong>Issues:</strong> <span id="modalRepoIssues"></span></div>
            </div>
            <div id="modalRepoLanguages" class="language-list"></div>
            <div class="modal-footer">
                <a id="modalRepoLink" class="btn btn-primary" target="_blank">View on GitHub</a>
                <a id="modalRepoWebsite" class="btn btn-secondary" target="_blank">Website</a>
            </div>
        </div>
    </div>

<script>
    
    const username = 'pionome';
    let currentPage = 1;
    let languagesCache = {};

    async function fetchRepos() {
        const loading = document.getElementById('loading');
        loading.style.display = 'block';
        
        try {
            const response = await fetch(`https://api.github.com/users/${username}/repos?page=${currentPage}&per_page=30&sort=updated`);
            const data = await response.json();
            
            if (data.length === 0) {
                document.getElementById('controls').style.display = 'none';
                return;
            }
            
            loading.style.display = 'none';
            displayRepos(data);
            currentPage++;
            document.getElementById('controls').style.display = 'flex';
        } catch (e) {
            document.getElementById('error').textContent = e.message;
            document.getElementById('error').style.display = 'block';
        }
    }

    function displayRepos(repos) {
        const container = document.getElementById('repos-container');
        repos.forEach(repo => {
            if (repo.fork) return;
            const card = document.createElement('div');
            card.className = 'repo-card';
            const color = getLanguageColor(repo.language);
            card.innerHTML = `
                <div class="repo-header">
                    <img src="${repo.owner.avatar_url}" class="repo-avatar">
                    <div><h3 class="repo-name">${repo.name}</h3><p class="repo-owner">${repo.owner.login}</p></div>
                </div>
                <p class="repo-description">${repo.description || 'No description'}</p>
                <div class="repo-stats">
                    <span class="repo-stat"><i class="fas fa-star"></i> ${repo.stargazers_count}</span>
                    <span class="repo-stat"><span class="repo-language-dot" style="background:${color}"></span> ${repo.language || 'Plain'}</span>
                </div>
            `;
            card.onclick = () => openModal(repo);
            container.appendChild(card);
        });
    }

    async function openModal(repo) {
        const modal = document.getElementById('repoModal');
        const loading = document.getElementById('modalLoading');
        modal.style.display = 'block';
        loading.style.display = 'block';

        document.getElementById('modalRepoName').textContent = repo.name;
        document.getElementById('modalRepoOwner').textContent = repo.owner.login;
        document.getElementById('modalRepoAvatar').src = repo.owner.avatar_url;
        document.getElementById('modalRepoDescription').textContent = repo.description || 'No description provided';
        document.getElementById('modalRepoStars').textContent = repo.stargazers_count;
        document.getElementById('modalRepoForks').textContent = repo.forks_count;
        document.getElementById('modalRepoWatchers').textContent = repo.watchers_count;
        document.getElementById('modalRepoIssues').textContent = repo.open_issues_count;
        document.getElementById('modalRepoLink').href = repo.html_url;
        
        const webBtn = document.getElementById('modalRepoWebsite');
        if (repo.homepage) { webBtn.href = repo.homepage; webBtn.style.display = 'block'; } 
        else { webBtn.style.display = 'none'; }

        if (!languagesCache[repo.name]) {
            const res = await fetch(repo.languages_url);
            languagesCache[repo.name] = await res.json();
        }
        
        const langDiv = document.getElementById('modalRepoLanguages');
        langDiv.innerHTML = '';
        Object.entries(languagesCache[repo.name]).forEach(([lang, bytes]) => {
            const tag = document.createElement('div');
            tag.className = 'language-tag';
            tag.innerHTML = `<span style="width:8px; height:8px; border-radius:50%; background:${getLanguageColor(lang)}"></span> ${lang}`;
            langDiv.appendChild(tag);
        });
        loading.style.display = 'none';
    }

    function getLanguageColor(lang) {
        const colors = {'JavaScript': '#f1e05a', 'Python': '#3572A5', 'Java': '#b07219', 'C++': '#f34b7d', 'C#': '#178600', 'CSS': '#563d7c', 'HTML': '#e34c26'};
        return colors[lang] || '#ccc';
    }

    document.getElementById('load-more').onclick = fetchRepos;
    window.onclick = (e) => { if(e.target == document.getElementById('repoModal')) document.getElementById('repoModal').style.display='none'; };
    fetchRepos();
</script>
<script src="/scripts/shared.js"></script>
</body>
</html>
