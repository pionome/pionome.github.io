<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quaternion Visualizer</title>
    <link rel="icon" type="image/png" href="/assets/favicon-96x96.png" sizes="96x96" />
	<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
	<link rel="shortcut icon" href="/assets/favicon.ico" />
	<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
	<meta name="apple-mobile-web-app-title" content="Pio" />
	<link rel="manifest" href="/assets/site.webmanifest" />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>

    <style>
        :root {
            --bg-color: #f4f8ff;      
            --grid-line: #dce7f7;     
            --panel-bg: #ffffff;
            --text-main: #5a6585;     
            --accent-primary: #94b0ff;
            --accent-secondary: #e0cdff;
            --accent-tag: #eef2ff;
            --border-width: 2px;
            --highlight: #6ba2ff;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                linear-gradient(var(--grid-line) 2px, transparent 2px),
                linear-gradient(90deg, var(--grid-line) 2px, transparent 2px);
            background-size: 60px 60px;
            display: flex; flex-direction: column; align-items: center;
        }

        .panel {
            background: var(--panel-bg);
            border: var(--border-width) solid var(--accent-primary);
            border-radius: 0.75rem;
            position: relative;
        }

        .navbar-toggle {
            position: fixed; font-size: 1.5rem; top: 15px; right: 15px;
            width: 45px; height: 45px; display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1001; background: white;
        }
        .navbar-toggle:hover { transform: translate(-3px, -3px); box-shadow: 4px 4px 0px var(--accent-primary); }

        .nav-panel {
            transform-origin: right;
            position: fixed;
            top: 15px; right: 100px;
            scale: 0 100%; opacity: 0; visibility: hidden;
            display: flex; flex-direction: column; gap: 0.4rem; padding: 20px;
            z-index: 1000;
        }
        
        .nav-panel.active { animation: bounceIn 0.5s cubic-bezier(0.34, 1.16, 0.94, 1) forwards; }
        
        .nav-main-row { display: flex; gap: 0.8rem; }
        .nav-sub-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .dashed-line { border: none; border-top: 2px dashed var(--grid-line); margin: 5px 0; }

        .nav-btn-large {
            flex: 1; text-align: center; color: var(--text-main); text-decoration: none;
            font-size: 1.2rem; font-weight: 1000; padding: 5px; transition: all 0.2s ease;
        }
        .nav-btn-large:hover { transform: translate(0px, -3px); box-shadow: 0px 4px 0px var(--accent-primary); color: var(--accent-primary); }

        .nav-tag-small {
            text-decoration: none; color: var(--text-main); background: #fff;
            font-size: 0.9rem; font-weight: 700; padding: 6px 14px; transition: all 0.2s ease;
        }
        .nav-tag-small:hover { box-shadow: 0px 4px 0px var(--accent-primary); color: var(--accent-primary); }

        @keyframes bounceIn {
            0% { scale: 0 100%; opacity: 0; visibility: hidden; }
            60% { scale: 105% 100%; opacity: 1; visibility: visible; }
            100% { scale: 100% 100%; opacity: 1; visibility: visible; }
        }

        .content-container {
            width: 95%; max-width: 1400px;
            margin: 100px 0 50px;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .left-col { flex: 0 0 400px; display: flex; flex-direction: column; gap: 20px; }
        .right-col { flex: 1; height: 80vh; min-height: 600px; }

        .section-title {
            font-size: 1.1rem; font-weight: 800; color: var(--accent-primary);
            margin-bottom: 15px; display: flex; align-items: center; gap: 10px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .control-group {
            padding: 20px;
        }

        .slider-container {
            margin-bottom: 15px;
            background: var(--accent-tag);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--grid-line);
        }
        .slider-label { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 700; margin-bottom: 5px; }
        
        input[type="range"] {
            width: 100%; height: 6px; background: var(--accent-secondary);
            border-radius: 3px; outline: none; -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            width: 16px; height: 16px; background: var(--accent-primary);
            border-radius: 50%; cursor: pointer; -webkit-appearance: none;
            transition: transform 0.1s; border: 2px solid white;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        input[type="number"] {
            width: 100%; padding: 8px; border: 2px solid var(--grid-line);
            border-radius: 6px; font-family: 'Fira Code', monospace;
            text-align: center; color: var(--text-main); font-weight: bold;
            box-sizing: border-box;
        }
        input[type="number"]:focus { outline: none; border-color: var(--accent-primary); }

        .quat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .matrix-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 5px; }
        
        .input-group label { font-size: 0.8rem; font-weight: 700; margin-bottom: 3px; display: block; }

        .action-btn {
            width: 100%; background: var(--accent-primary); color: white; border: none;
            padding: 10px; border-radius: 8px; font-weight: 800; cursor: pointer;
            transition: all 0.2s; font-family: 'M PLUS Rounded 1c', sans-serif;
        }
        .action-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px var(--accent-secondary);
        }

        .color-chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .color-chip {
            padding: 8px 4px; border-radius: 6px; font-size: 0.75rem; font-weight: 700;
            color: white; text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        #appDiv {
            width: 100%; height: 100%;
            border-radius: 0.75rem;
            overflow: hidden;
            position: relative;
        }

        #axesInfo {
            position: absolute; top: 15px; left: 15px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px; border-radius: 8px;
            border: 2px solid var(--accent-primary);
            box-shadow: 4px 4px 0px rgba(148, 176, 255, 0.2);
            font-size: 0.85rem; font-weight: 700;
        }
        .axis-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .axis-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); }

        @media (max-width: 1000px) {
            .content-container { flex-direction: column; }
            .left-col { flex: none; width: 100%; }
            .right-col { width: 100%; height: 60vh; }
            .nav-panel { top: 75px; left: 0; right: 0; margin: 10px; }
        }
    </style>
</head>
<body>

    <nav class="panel nav-panel" id="navbarPanel">
        <div class="nav-main-row">
            <a href="/" class="nav-btn-large"><i class="fa-solid fa-house"></i> Home</a>
            <a href="/art" class="nav-btn-large"><i class="fa-solid fa-paint-brush"></i> Art</a>
            <a href="/games" class="nav-btn-large"><i class="fa-solid fa-gamepad"></i> Games</a>
        </div>
        <hr class="dashed-line">
        <div class="nav-sub-row">
            <a href="/web-apps" class="nav-tag-small" style="color:var(--accent-primary);">Web Apps</a>
            <a href="/programs" class="nav-tag-small">Programs</a>
            <a href="/misc-programs" class="nav-tag-small">Misc Programs</a>
            <a href="/repositories" class="nav-tag-small">Repos</a>
            <a href="/mods" class="nav-tag-small">Mods</a>
        </div>
    </nav>
    <div class="panel navbar-toggle" id="navbarToggle"><i class="fa-solid fa-bars"></i></div>

    <div class="content-container">
        
        <div class="left-col">
            <div class="panel control-group">
                <div class="section-title"><i class="fas fa-link"></i> Euler Angles (Deg)</div>
                
                <div class="slider-container">
                    <div class="slider-label"><span>Pitch (X)</span></div>
                    <input type="range" id="eulerX" min="-180" max="180" value="0">
                    <input type="number" id="eulerX-value" value="0" style="margin-top:5px;">
                </div>

                <div class="slider-container">
                    <div class="slider-label"><span>Yaw (Y)</span></div>
                    <input type="range" id="eulerY" min="-180" max="180" value="0">
                    <input type="number" id="eulerY-value" value="0" style="margin-top:5px;">
                </div>

                <div class="slider-container">
                    <div class="slider-label"><span>Roll (Z)</span></div>
                    <input type="range" id="eulerZ" min="-180" max="180" value="0">
                    <input type="number" id="eulerZ-value" value="0" style="margin-top:5px;">
                </div>
            </div>

            <div class="panel control-group">
                <div class="section-title"><i class="fas fa-bolt"></i> Quaternion</div>
                <div class="quat-grid">
                    <div class="input-group"><label>W</label><input type="number" id="quatW" value="1.0" step="0.01"></div>
                    <div class="input-group"><label>X</label><input type="number" id="quatX" value="0.0" step="0.01"></div>
                    <div class="input-group"><label>Y</label><input type="number" id="quatY" value="0.0" step="0.01"></div>
                    <div class="input-group"><label>Z</label><input type="number" id="quatZ" value="0.0" step="0.01"></div>
                </div>
                <button id="applyQuat" class="action-btn"><i class="fas fa-check"></i> Apply Quaternion</button>
            </div>

            <div class="panel control-group">
                <div class="section-title"><i class="fas fa-table"></i> Rotation Matrix</div>
                <div class="matrix-row">
                    <input type="number" id="m00" value="1.0" step="0.1">
                    <input type="number" id="m01" value="0.0" step="0.1">
                    <input type="number" id="m02" value="0.0" step="0.1">
                </div>
                <div class="matrix-row">
                    <input type="number" id="m10" value="0.0" step="0.1">
                    <input type="number" id="m11" value="1.0" step="0.1">
                    <input type="number" id="m12" value="0.0" step="0.1">
                </div>
                <div class="matrix-row">
                    <input type="number" id="m20" value="0.0" step="0.1">
                    <input type="number" id="m21" value="0.0" step="0.1">
                    <input type="number" id="m22" value="1.0" step="0.1">
                </div>
                <button id="applyMatrix" class="action-btn" style="margin-top:10px;"><i class="fas fa-check"></i> Apply Matrix</button>
            </div>

            <div class="panel control-group">
                <div class="section-title"><i class="fas fa-cube"></i> Reference</div>
                <div class="color-chips">
                    <div class="color-chip" style="background:#ff3333;">+X Right</div>
                    <div class="color-chip" style="background:#ff7700;">-X Left</div>
                    <div class="color-chip" style="background:#33cc33;">+Y Top</div>
                    <div class="color-chip" style="background:#3366ff;">-Y Bottom</div>
                    <div class="color-chip" style="background:#ffff33; color:#555;">+Z Front</div>
                    <div class="color-chip" style="background:#aa55ff;">-Z Back</div>
                </div>
                <div style="font-size:0.8rem; margin-top:15px; opacity:0.8; line-height:1.6;">
                    <strong>Controls:</strong> Left Drag (Rotate) • Right Drag (Pan) • Scroll (Zoom) • Double Click (Reset)
                </div>
            </div>
        </div>

        <div class="right-col panel" id="appDiv">
            <div id="axesInfo">
                <div class="axis-item"><div class="axis-dot" style="background:#ff5555;"></div> X-Axis</div>
                <div class="axis-item"><div class="axis-dot" style="background:#55ff55;"></div> Y-Axis</div>
                <div class="axis-item"><div class="axis-dot" style="background:#5555ff;"></div> Z-Axis</div>
            </div>
        </div>

    </div>

    <script src="/scripts/apps/quaternionVisualizer.js"></script>
    <script src="/scripts/shared.js"></script>
</body>
</html>
