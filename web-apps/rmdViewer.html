<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMD Viewer</title>
    <link rel="icon" type="image/png" href="/assets/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Pio" />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <script src="/scripts/apps/gl-matrix/gl-matrix.js"></script>
    <script src="/scripts/apps/reader.js"></script>
    <script src="/scripts/apps/rmd.js"></script>
    <style>
        :root {
            --bg-color: #f4f8ff;
            --grid-line: #dce7f7;
            --panel-bg: #ffffff;
            --text-main: #5a6585;
            --accent-primary: #94b0ff;
            --accent-secondary: #e0cdff;
            --accent-tag: #eef2ff;
            --border-width: 2px;
            --radius-main: 1rem;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-image: 
                linear-gradient(var(--grid-line) 2px, transparent 2px),
                linear-gradient(90deg, var(--grid-line) 2px, transparent 2px);
            background-size: 60px 60px;
            display: flex;
            flex-direction: column;
        }

        .panel {
            background: var(--panel-bg);
            border: var(--border-width) solid var(--accent-primary);
            border-radius: var(--radius-main);
            box-shadow: 4px 4px 0px rgba(148, 176, 255, 0.2);
        }

        .btn-ui {
            font-family: inherit;
            background: white;
            border: 2px solid var(--accent-primary);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-ui:hover:not(:disabled) {
            transform: translate(-3px, -3px);
            box-shadow: 4px 4px 0px var(--accent-primary);
            color: var(--accent-primary);
        }

        .btn-ui:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #f5f5f5;
            border-color: #ddd;
        }

        .navbar-toggle {
            box-sizing: content-box;
            border-radius: 0.75rem;
            position: fixed;
            font-size: 1.5rem;
            top: 15px;
            right: 15px;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1001;
            background: white;
            box-shadow: unset;
        }

        .navbar-toggle:hover {
            transform: translate(-3px, -3px);
            box-shadow: 4px 4px 0px var(--accent-primary);
        }

        .nav-panel {
            transform-origin: right;
            position: fixed;
            top: 15px;
            right: 100px;
            scale: 0 100%;
            opacity: 0;
            visibility: hidden;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            padding: 20px;
            z-index: 1000;
        }

        .nav-panel.active {
            animation: bounceIn 0.5s cubic-bezier(0.34, 1.16, 0.94, 1) forwards;
        }

        @keyframes bounceIn {
            0% { scale: 0 100%; opacity: 0; visibility: hidden; }
            60% { scale: 105% 100%; opacity: 1; visibility: visible; }
            100% { scale: 100% 100%; opacity: 1; visibility: visible; }
        }

        .nav-main-row { display: flex; gap: 0.8rem; }

        .nav-btn-large {
            flex: 1;
            text-align: center;
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 1000;
            padding: 5px;
            transition: all 0.2s ease;
        }

        .nav-btn-large:hover {
            transform: translate(0px, -3px);
            box-shadow: 0px 4px 0px var(--accent-primary);
            color: var(--accent-primary);
        }

        .dashed-line {
            border: none;
            border-top: 2px dashed var(--grid-line);
            margin: 5px 0;
        }

        .nav-sub-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .nav-tag-small {
            text-decoration: none;
            color: var(--text-main);
            background: #fff;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 6px 14px;
            transition: all 0.2s ease;
        }

        .nav-tag-small:hover {
            box-shadow: 0px 4px 0px var(--accent-primary);
            color: var(--accent-primary);
        }

        .app-container {
            display: flex;
            height: 100vh;
            padding: 15px;
            gap: 15px;
        }

        .sidebar {
            width: 320px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            padding: 20px;
            z-index: 10;
        }

        .sidebar h1 {
            margin: 0 0 10px 0;
            font-size: 1.8rem;
            color: var(--accent-primary);
            text-align: center;
            border-bottom: 2px dashed var(--grid-line);
            padding-bottom: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .control-label {
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="file"] { display: none; }

        .file-upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: white;
            border: 2px dashed var(--accent-primary);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-family: inherit;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 5px;
        }

        .file-upload-label:hover {
            background: var(--accent-tag);
            border-style: solid;
            color: var(--accent-primary);
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px var(--accent-primary);
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: 2px solid var(--grid-line);
            border-radius: 8px;
            width: 100%;
            height: 40px;
            padding: 2px;
            cursor: pointer;
        }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 5px; }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            padding: 10px;
            border: 2px solid var(--grid-line);
            border-radius: 8px;
            transition: 0.2s;
        }

        .checkbox-wrapper:hover { border-color: var(--accent-primary); background: white; }
        .checkbox-wrapper input { accent-color: var(--accent-primary); width: 18px; height: 18px; cursor: pointer; }

        .info-box {
            background: var(--accent-tag);
            padding: 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-main);
            border: 1px solid var(--grid-line);
        }

        .info-box p { margin: 5px 0; }

        .viewport-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        #appDiv {
            width: 100%;
            height: 100%;
            position: relative;
            background: white;
        }

        canvas { width: 100%; height: 100%; display: block; outline: none; }

        #animation-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            border: 2px solid var(--accent-primary);
            border-radius: 1rem;
            padding: 15px 25px;
            box-shadow: 0 8px 32px rgba(148, 176, 255, 0.2);
            transition: 0.3s;
            display: none;
        }

        .anim-controls-inner {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .anim-row {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: space-between;
        }

        select.anim-select {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid var(--grid-line);
            border-radius: 8px;
            font-family: inherit;
            font-weight: 700;
            color: var(--text-main);
            outline: none;
            background: white;
        }

        select.anim-select:focus { border-color: var(--accent-primary); }

        .frame-counter {
            font-family: monospace;
            font-weight: 700;
            background: var(--accent-tag);
            padding: 5px 10px;
            border-radius: 5px;
            color: var(--accent-primary);
            min-width: 100px;
            text-align: center;
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--accent-primary);
            height: 6px;
            border-radius: 5px;
            cursor: pointer;
        }

        @media (max-width: 900px) {
            .app-container { flex-direction: column; overflow: auto; height: auto; }
            .sidebar { width: 100%; min-width: 0; max-height: 400px; }
            .viewport-wrapper { height: 60vh; min-height: 400px; }
            #animation-panel { width: 95%; bottom: 10px; padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="panel navbar-toggle" id="navbarToggle">
        <i class="fa-solid fa-bars"></i>
    </div>

    <nav class="panel nav-panel" id="navbarPanel">
        <div class="nav-main-row">
            <a href="/" class="nav-btn-large"><i class="fa-solid fa-house"></i> Home</a>
            <a href="/art" class="nav-btn-large"><i class="fa-solid fa-paint-brush"></i> Art</a>
            <a href="/games" class="nav-btn-large"><i class="fa-solid fa-gamepad"></i> Games</a>
        </div>
        <hr class="dashed-line">
        <div class="nav-sub-row">
            <a href="/web-apps" class="nav-tag-small" style="color:var(--accent-primary);">Web Apps</a>
            <a href="/programs" class="nav-tag-small">Programs</a>
            <a href="/misc-programs" class="nav-tag-small">Misc Programs</a>
            <a href="/repositories" class="nav-tag-small">Repos</a>
            <a href="/mods" class="nav-tag-small">Mods</a>
        </div>
    </nav>

    <div class="app-container">
        <aside class="panel sidebar">
            <h1>RMD Viewer</h1>
            <div class="control-group">
                <span class="control-label"><i class="fas fa-folder-open"></i> Load Model</span>
                <label for="modelSelect" class="file-upload-label">
                    <i class="fas fa-upload"></i> Choose File (.rmd/.pac)
                </label>
                <input id="modelSelect" type="file" accept=".rmd, .pac">
            </div>
            <div class="control-group">
                <label class="control-label"><i class="fas fa-palette"></i> Background</label>
                <input id="BGcolorSelect" type="color" value="#ffffff">
            </div>
            <div class="control-group">
                <label class="control-label"><i class="fas fa-bone"></i> Bones</label>
                <input id="BoneColorSelect" type="color" value="#ff6b9d" style="margin-bottom:5px;">
                <label class="checkbox-wrapper" for="BonesChk">
                    <input type="checkbox" id="BonesChk">
                    <span>Show Skeleton</span>
                </label>
            </div>
            <div class="info-box">
                <div style="font-weight:800; margin-bottom:8px; color:var(--accent-primary);">
                    <i class="fas fa-gamepad"></i> Controls
                </div>
                <p>• <b>Left Drag:</b> Rotate</p>
                <p>• <b>Right Drag:</b> Move</p>
                <p>• <b>Scroll:</b> Zoom</p>
                <p>• <b>Double Click:</b> Reset</p>
            </div>
        </aside>

        <main class="panel viewport-wrapper">
            <div id="appDiv">
                <canvas id="webgl-canvas"></canvas>
            </div>
            <div id="animation-panel">
                <div class="anim-controls-inner">
                    <div class="anim-row">
                        <select id="animationSelect" class="anim-select">
                            <option value="-1">No Animation</option>
                        </select>
                        <span id="frameIndicator" class="frame-counter">Fr: 0/0</span>
                    </div>
                    <div class="anim-row">
                        <button id="playButton" class="btn-ui" style="min-width: 50px;" disabled>
                            <i class="fas fa-play"></i>
                        </button>
                        <input type="range" id="frameSlider" min="0" value="0" disabled>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/scripts/apps/rmdViewer.js"></script>
    <script src="/scripts/shared.js"></script>
</body> 
</html>
