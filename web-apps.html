<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pio - Web Apps</title>
    <link rel="icon" type="image/png" href="/assets/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Pio" />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #f4f8ff;      
            --grid-line: #dce7f7;     
            --panel-bg: #ffffff;
            --text-main: #5a6585;     
            --accent-primary: #94b0ff;
            --accent-secondary: #e0cdff;
            --accent-tag: #eef2ff;
            --border-width: 2px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                linear-gradient(var(--grid-line) 2px, transparent 2px),
                linear-gradient(90deg, var(--grid-line) 2px, transparent 2px);
            background-size: 60px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .panel {
            background: var(--panel-bg);
            border: var(--border-width) solid var(--accent-primary);
            border-radius: 0.75rem;
        }

        .navbar-toggle {
            position: fixed;
            font-size: 1.5rem;
            top: 15px;
            right: 15px;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1001;
            background: white;
        }

        .navbar-toggle:hover {
            transform: translate(-3px, -3px);
            box-shadow: 4px 4px 0px var(--accent-primary);
        }

        .nav-panel {
            transform-origin: right;
            position: fixed;
            top: 15px;
            right: 100px;
            scale: 0 100%;
            opacity: 0;
            visibility: hidden;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            padding: 20px;
            z-index: 1000;
        }
        
        .nav-main-row {
            display: flex;
            gap: 0.8rem;
        }

        .nav-btn-large {
            flex: 1;
            text-align: center;
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 800;
            padding: 5px;
            transition: all 0.2s ease;
        }

        .nav-btn-large:hover {
            transform: translate(0px, -3px);
            box-shadow: 0px 4px 0px var(--accent-primary);
            color: var(--accent-primary);
        }

        .dashed-line {
            border: none;
            border-top: 2px dashed var(--grid-line);
            margin: 5px 0;
        }

        .nav-sub-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .nav-tag-small {
            text-decoration: none;
            color: var(--text-main);
            background: #fff;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 6px 14px;
            transition: all 0.2s ease;
        }

        .nav-tag-small:hover {
            box-shadow: 0px 4px 0px var(--accent-primary);
            color: var(--accent-primary);
        }

        .nav-panel.active {
            animation: bounceIn 0.5s cubic-bezier(0.34, 1.16, 0.94, 1) forwards;
        }
        
        @keyframes bounceIn {
            0% { scale: 0 100%; opacity: 0; visibility: hidden; }
            60% { scale: 105% 100%; opacity: 1; visibility: visible; }
            100% { scale: 100% 100%; opacity: 1; visibility: visible; }
        }

        .content-container { 
            width: 98%;
            max-width: 1500px;
            margin: 100px 0 50px;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0 0 40px;
            text-align: center;
            color: var(--text-main);
        }

        .webapps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 315px); 
            gap: 25px;
            justify-content: center;
        }

        .webapp-card {
            background: white;
            border: var(--border-width) solid var(--accent-primary);
            border-radius: 1rem;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
            width: 315px;
            display: flex;
            flex-direction: column;
        }

        .webapp-card:hover {
            transform: translate(-5px, -5px);
            box-shadow: 7px 7px 0px var(--accent-primary);
        }

        .webapp-thumbnail {
            width: 315px;
            height: 250px; 
            object-fit: cover;
            border-bottom: var(--border-width) solid var(--accent-primary);
        }

        .webapp-info {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .webapp-name {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 800;
            line-height: 1.2;
        }

        .webapp-description {
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.4;
            opacity: 0.85;
        }

        #loading {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 50px;
        }

        #error {
            text-align: center;
            color: #ff6b6b;
            display: none;
            margin-top: 20px;
            font-weight: 700;
        }
        
        @media (max-width: 1200px) {
            .nav-panel { top: 75px; left: 0; right: 0; margin: 10px; transform-origin: top; }
        }
    </style>
</head>
<body>

    <nav class="panel nav-panel" id="navbarPanel">
        <div class="nav-main-row">
            <a href="/" class="nav-btn-large"><i class="fa-solid fa-house"></i> Home</a>
            <a href="/art" class="nav-btn-large"><i class="fa-solid fa-paint-brush"></i> Art</a>
            <a href="/games" class="nav-btn-large"><i class="fa-solid fa-gamepad"></i> Games</a>
        </div>
        <hr class="dashed-line">
        <div class="nav-sub-row">
            <a href="/web-apps" class="nav-tag-small" style="color:var(--accent-primary)">Web Apps</a>
            <a href="/programs" class="nav-tag-small">Programs</a>
            <a href="/misc-programs" class="nav-tag-small">Misc Programs</a>
            <a href="/repositories" class="nav-tag-small">Repos</a>
            <a href="/mods" class="nav-tag-small">Mods</a>
        </div>
    </nav>
    <div class="panel navbar-toggle" id="navbarToggle"><i class="fa-solid fa-bars"></i></div>

    <div class="content-container">
        <h2 class="section-title">Web Applications</h2>
        <div id="loading">Loading Apps...</div>
        <div id="error"></div>
        <div id="webapps-grid" class="webapps-grid"></div>
    </div>

<script>

    document.addEventListener('DOMContentLoaded', function() {
        const grid = document.getElementById('webapps-grid');
        const loading = document.getElementById('loading');
        const errorDiv = document.getElementById('error');

        fetch('/data/webapps.json')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(data => {
                loading.style.display = 'none';
                data.forEach(webapp => createWebappCard(webapp));
            })
            .catch(error => {
                loading.style.display = 'none';
                errorDiv.textContent = `Error loading web apps: ${error.message}`;
                errorDiv.style.display = 'block';
            });

        function createWebappCard(webapp) {
            const card = document.createElement('a');
            card.className = 'webapp-card';
            card.href = webapp.htmlFile;
            card.innerHTML = `
                <img src="${webapp.thumbnail}" class="webapp-thumbnail" alt="${webapp.name}">
                <div class="webapp-info">
                    <h3 class="webapp-name">${webapp.name}</h3>
                    <p class="webapp-description">${webapp.description}</p>
                </div>
            `;
            grid.appendChild(card);
        }
    });
</script>
<script src="/scripts/shared.js"></script>
</body>
</html>
